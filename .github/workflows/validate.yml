name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check scripts
        run: |
          for f in scripts/*.mjs hooks/*.mjs; do
            node --check "$f"
          done
      - name: Validate skill frontmatter
        run: node scripts/validate-skills.mjs
